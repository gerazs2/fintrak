spring.application.name=fintrak
spring.profiles.default=dev

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.expiration-ms=86400000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# Flyway: si la base de datos ya tiene tablas y nunca ha usado Flyway,
# marcar V1 como aplicada en lugar de ejecutarla
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

ia.url=${IA_URL:https://api.groq.com/openai/v1/chat/completions}
ia.modelo=${IA_MODELO:qwen/qwen3.8-27b}
ia.limite-diario=${IA_LIMITE_DIARIO:10}